<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#115E59"/>
  <!-- Die plate body -->
  <rect x="100" y="80" width="200" height="140" rx="10" fill="rgba(255,255,255,0.18)"/>
  <rect x="112" y="92" width="176" height="116" rx="6" fill="rgba(255,255,255,0.1)"/>
  <!-- Central bore (round) -->
