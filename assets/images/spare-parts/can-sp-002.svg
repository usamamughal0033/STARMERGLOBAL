  <line x1="95"  y1="80"  x2="95"  y2="220" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="110" y="228" width="180" height="26" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="200" y="246" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle">CEQ-SP-CAN-002</text>
