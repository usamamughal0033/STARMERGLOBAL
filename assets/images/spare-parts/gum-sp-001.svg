<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#5B21B6"/>
  <!-- Two calender rolls shown as cylinders -->
  <!-- Roll 1 -->
  <ellipse cx="140" cy="90"  rx="55" ry="20" fill="rgba(255,255,255,0.28)"/>
  <rect    x="85"  y="90"   width="110" height="110" fill="rgba(255,255,255,0.18)"/>
  <ellipse cx="140" cy="200" rx="55" ry="20" fill="rgba(255,255,255,0.22)"/>
  <!-- Chrome surface sheen -->
  <rect x="95" y="95" width="12" height="100" rx="4" fill="rgba(255,255,255,0.35)"/>
  <!-- Roll 2 -->
  <ellipse cx="260" cy="90"  rx="55" ry="20" fill="rgba(255,255,255,0.28)"/>
  <rect    x="205" y="90"   width="110" height="110" fill="rgba(255,255,255,0.18)"/>
  <ellipse cx="260" cy="200" rx="55" ry="20" fill="rgba(255,255,255,0.22)"/>
  <rect x="215" y="95" width="12" height="100" rx="4" fill="rgba(255,255,255,0.35)"/>
  <!-- Cooling channel inlets -->
  <rect x="118" y="80" width="16" height="14" rx="3" fill="rgba(255,255,255,0.4)"/>
  <rect x="238" y="80" width="16" height="14" rx="3" fill="rgba(255,255,255,0.4)"/>
  <!-- Label "Matched Pair" -->
  <text x="200" y="216" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.45)" text-anchor="middle">MATCHED PAIR · POSITIONS 3 &amp; 4</text>
  <rect x="110" y="228" width="180" height="26" rx="5" fill="rgba(0,0,0,0.3)"/>
  <text x="200" y="246" font-family="'Courier New',monospace" font-size="11" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle">CEQ-SP-GUM-001</text>
</svg>
