<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click Rush — Mouse Click Counter Game</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#181c2f;
    --accent:#ffb703;
    --accent2:#fb8500;
    --text:#f3f4f8;
    --muted:#9aa0b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 0%,#1e2440,var(--bg) 70%);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    user-select:none;
    padding:20px;
  }
  .wrap{width:100%;max-width:420px;text-align:center}
  h1{font-size:1.9rem;letter-spacing:1px;margin-bottom:4px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:22px}

  .stats{
    display:flex;gap:12px;margin-bottom:22px;
  }
  .stat{
    flex:1;background:var(--panel);border-radius:14px;padding:14px 8px;
    border:1px solid rgba(255,255,255,.06);
  }
  .stat b{display:block;font-size:1.6rem;line-height:1.2}
  .stat small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:1px}

  .bar{height:8px;background:var(--panel);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .1s linear}

  #target{
    width:200px;height:200px;border-radius:50%;
    border:none;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#ffd166,var(--accent2));
    box-shadow:0 12px 40px rgba(251,133,0,.35);
    font:700 1.15rem/1.2 inherit;color:#2b1a00;
    transition:transform .06s ease;
    position:relative;
  }
  #target:active{transform:scale(.93)}
  #target:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}

  .msg{margin-top:20px;min-height:48px;font-size:1rem;color:var(--muted)}
  .msg strong{color:var(--accent);font-size:1.25rem}

  button.reset{
    margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.18);
    color:var(--text);padding:9px 20px;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem;
  }
  button.reset:hover{border-color:var(--accent);color:var(--accent)}

  .pop{
    position:fixed;pointer-events:none;font-weight:700;color:var(--accent);
    animation:float .7s ease-out forwards;font-size:1.1rem;
  }
  @keyframes float{
    to{transform:translate(-50%,-70px);opacity:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>CLICK <span>RUSH</span></h1>
  <p class="sub">Click as many times as you can in 10 seconds</p>

  <div class="stats">
    <div class="stat"><b id="score">0</b><small>Clicks</small></div>
    <div class="stat"><b id="time">10.0</b><small>Seconds</small></div>
    <div class="stat"><b id="best">0</b><small>Best</small></div>
  </div>

  <div class="bar"><i id="fill"></i></div>

  <button id="target">CLICK<br>TO START</button>

  <div class="msg" id="msg"></div>
  <button class="reset" id="reset">Reset best score</button>
</div>

<script>
const DURATION = 10000;
const $ = id => document.getElementById(id);
const target = $('target'), scoreEl = $('score'), timeEl = $('time'),
      bestEl = $('best'), fill = $('fill'), msg = $('msg');

let score = 0, running = false, endTime = 0, raf = null;
let best = Number(localStorage.getItem('clickRushBest') || 0);
bestEl.textContent = best;

function start(){
  score = 0; running = true;
  endTime = performance.now() + DURATION;
  scoreEl.textContent = '0';
  msg.textContent = 'GO GO GO!';
  target.innerHTML = 'CLICK!';
  tick();
}

function tick(){
  const left = Math.max(0, endTime - performance.now());
  timeEl.textContent = (left / 1000).toFixed(1);
  fill.style.width = (left / DURATION * 100) + '%';
  if (left <= 0) return finish();
  raf = requestAnimationFrame(tick);
}

function finish(){
  running = false;
  cancelAnimationFrame(raf);
  timeEl.textContent = '0.0';
  fill.style.width = '0%';
  target.innerHTML = 'PLAY<br>AGAIN';

  const cps = (score / (DURATION / 1000)).toFixed(1);
  const isBest = score > best;
  if (isBest){
    best = score;
    localStorage.setItem('clickRushBest', best);
    bestEl.textContent = best;
  }
  msg.innerHTML = `<strong>${score} clicks</strong><br>${cps} clicks/sec` +
                  (isBest ? ' — new record! 🏆' : '');
}

function pop(e){
  const el = document.createElement('div');
  el.className = 'pop';
  el.textContent = '+1';
  el.style.left = e.clientX + 'px';
  el.style.top = e.clientY + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

target.addEventListener('click', e => {
  if (!running){ start(); return; }
  score++;
  scoreEl.textContent = score;
  pop(e);
});

$('reset').addEventListener('click', () => {
  best = 0;
  localStorage.removeItem('clickRushBest');
  bestEl.textContent = '0';
  msg.textContent = 'Best score cleared.';
});
</script>
</body>
</html>
