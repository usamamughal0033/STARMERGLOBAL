- name: Pulling Machine
  model: ''
  function: >-
    The purpose of a pulling machine is to stretch and fold cooked candy or toffee
    in a controlled way to improve its texture and structure. By continuously
    pulling the mass it incorporates air, evens out temperature and develops the
    desired smoothness, shine and chew of the final product.
  description: Hard-chromed 3-arm pulling machine with 10 hp main drive and S.S 201 side sheets.
  image: ''
  specs:
    capacity: 100 kg
    mainDriveMotor: 10 hp
    arms: Hard chromed
    armsForContinuousPulling: 3 arms
    sideSheets: S.S 201
    controls: Electric panel for control
    powerLoad: 10 hp
