    The batch roller is a key intermediate machine in the candy, lollipop, toffee
    and fudge production line, designed to continuously roll, shape and form the
    cooked mass into a uniform cylindrical rope and ensure consistent rope size and
    proper distribution of centre filling, flavor and color before feeding the rope
    sizer.
