- name: Toffee Cooker
  model: ''
  function: >-
    The purpose of a toffee cooker is to heat and cook sugar-based mixtures to a
    controlled temperature so the toffee reaches the correct thickness, texture and
    moisture level, providing uniform heating and precise temperature control for
    consistent quality and the required hardness or chewiness.
  description: Double-jacketed S.S 304 toffee cooker with stirrer, coil, 3 hp gear-motor drive and safety valve.
  image: ''
  specs:
    capacity: 150 kg per batch after 20 to 25 mins
    stirrer: S.S 304
    panMaterial: S.S 304
    pan: Double jacketed with S.S 304 (M.S optional)
    frame: M.S (S.S optional)
    controls: Electric panel with new feature
    drive: 3 hp gear-motor drive
    safetyValve: Yes
    panCover: S.S 304
    powerLoad: 3 hp
- name: Cooling Table
  model: SEW-108
  function: >-
    The cooling table is a crucial post-cooking unit used for rapid cooling and
    conditioning of the cooked sugar mass before further processing such as mixing,
    flavoring, coloring or forming, ensuring uniform texture and workability.
  description: S.S 304 cooling table with water-cooled base plate and S.S 201 legs.
  image: ''
  specs:
    basePlateThickness: 10 mm in S.S 304
    materialOfPlate: Boundary wall S.S 304
    coolingMedium: Water; A-frame for moving water inlet/outlet valve
    legs: 4 Nos in S.S 201 grade
    dimension: 3 ft x 6 ft x 2'6" (W x L x H)
    powerLoad: 0
- name: Pulling Machine
  model: ''
  function: >-
    The purpose of a pulling machine is to stretch and fold cooked candy or toffee
    in a controlled way to improve its texture and structure. By continuously
    pulling the mass it incorporates air, evens out temperature and develops the
    desired smoothness, shine and chew of the final product.
  description: Hard-chromed 3-arm pulling machine with 10 hp main drive and S.S 201 side sheets.
  image: ''
  specs:
    capacity: 100 kg
    mainDriveMotor: 10 hp
    arms: Hard chromed
    armsForContinuousPulling: 3 arms
    sideSheets: S.S 201
    controls: Electric panel for control
    powerLoad: 10 hp
- name: Liquid Filling Pump
  model: ''
  function: >-
    The centre filling pump is a precision dosing system designed to inject liquid
    filling (such as fruit syrup, chocolate, cream or jam) into the core of the
    candy rope during the forming process, ensuring consistent filling quantity and
    uniform distribution across all candies.
  description: >-
    Double-jacketed S.S 304 filling pump with Teflon-lined keef, food-grade flexible
    pipe, 2 hp gear-motor drive, heater and 2 hp inverter with overflow recycling.
  image: ''
  specs:
    filling: Chocolate and liquid
    keef: S.S 304, double jacketed, 1.5 with Teflon food-grade heat-proof covering
    pipe: Flexible food grade
    controls: Electric panel with new feature
    gearMotor: 2 hp main drive
    stand: M.S
    heater: 1000 watt (1 No) to moderate temperature
    inverter: 2 hp to increase or decrease filling in product
    overflow: System to recycle liquid/chocolate
    powerLoad: 3.34 hp
- name: Batch Roller
  model: ''
  function: >-
    The batch roller is a key intermediate machine in the candy, lollipop, toffee
    and fudge production line, designed to continuously roll, shape and form the
    cooked mass into a uniform cylindrical rope and ensure consistent rope size and
    proper distribution of centre filling, flavor and color before feeding the rope
    sizer.
  description: >-
    Horizontal 4-roller batch roller in S.S 304 food grade with 1 hp main and 1 hp
    up/down drives, heaters and SEW (Germany) gear motors; 75 kg capacity.
  image: ''
  specs:
    frame: Horizontal work
    rollersQuantity: 4
    rollersMaterial: S.S 304 food grade
    upperBody: S.S 304 food grade
    mainDrive: Gear motor 1 hp
    upDownDrive: 1 hp
    heaters: 1000 watt (2 Nos) to maximum temperature
    capacity: 75 kg
    length: 6.5 ft
    gearMotor: SEW brand Germany
    rollerCaplexe: Casting material
    extra: Additional tray for removal of wastage
    dimension: 4'4" x 4' x 2'2" x 7' (W x H x L)
    powerLoad: 4.68 hp
- name: Rope Sizer
  model: SEW-212
  function: >-
    The rope sizer is a precision machine used to accurately reduce and calibrate
    the diameter of the candy and toffee rope produced by the batch roller,
    ensuring a uniform rope thickness suitable for feeding the forming or cutting
    machine and maintaining consistent size and weight throughout production.
  description: >-
    Horizontal 5-stage rope sizer (4 horizontal + 1 vertical) in S.S 304 with brass
    rope guides, INVENT inverter and SEW (Germany) gear motors.
  image: ''
  specs:
    sizerModel: Horizontal, 5 stages (4 horizontal + 1 vertical)
    firstPair: S.S 304, 37 mm
    secondPair: S.S 304, 32 mm
    thirdPair: S.S 304, 27 mm
    fourthPair: S.S 304, 22 mm
    fifthPair: S.S 304, 17 mm
    electricPanel: S.S 201
    sizerPlates: S.S 304
    sideSheets: S.S 201
    ropeGuide: Brass
    inverter: INVENT brand, 3 hp
    gearMotors: SEW brand Germany, 3 hp
    heatControllers: 2 Nos
    electricHeaters: 500 x 4 = 2 kW
    safety: Emergency break to stop equipment, emergency switch to off equipment, electric breakers
    electricComponents: Brand new
    dimension: 6'6" x 3' x 5'6" (H x W x L)
    powerLoad: 5.68 hp
- name: Uniplast (160-A)
  model: ''
  function: >-
    The Uniplast has been designed for the continuous production of seamless sweets
    with or without centre filling using a standard die arrangement. It can be used
    as part of a complete production plant supplied by Starmer Engineering Works or
    integrated into an existing line. Suitable for forming hard-boiled candies,
    centre liquid-filled, centre powder-filled, toffees, chewy toffees, chews and
    bubble-gum products, forming seamless sweets with high depth thickness.
  description: >-
    Continuous forming machine with 5 hp main drive, 5 hp INVENT inverter,
    bearing-steel cams and high-carbon-steel forged gears; up to 450 kg/hr.
  image: ''
