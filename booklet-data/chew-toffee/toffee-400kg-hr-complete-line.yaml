# Eclair Toffee 400 kg/hr Complete Line -- extracted from TOFFEE 400 KG.pdf
category: CHEW & TOFFEE
category_slug: chew-toffee
line:
  name: Toffee 400kg/hr Complete Line
  productionRate: 400 kg/hr
  description: >-
    A complete eclair-toffee production line rated at 400 kg/hr, covering glucose
    storage, steam generation, cooking, cooling, pulling, liquid centre filling,
    batch rolling, five-stage rope sizing, Uniplast forming with rotary die and die
    stand, three-stage cooling tunnel with AC and double-twist wrapping.
