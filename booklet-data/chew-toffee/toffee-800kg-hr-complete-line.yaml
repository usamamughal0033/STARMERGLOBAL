# Eclair Toffee 800 kg/hr Complete Line -- extracted from TOFFEE 800 KG.pdf
category: CHEW & TOFFEE
category_slug: chew-toffee
line:
  name: Toffee 800kg/hr Complete Line
  productionRate: 800 kg/hr
  description: >-
    A complete high-speed eclair-toffee production line rated at 800 kg/hr,
    covering glucose storage, high-capacity steam generation, twin toffee cookers,
    cooling, pulling, liquid centre filling, batch rolling, five-stage rope sizing,
    Uniplast 160-C forming with rotary die and die stand, a 20-ton three-stage
    cooling tunnel and double-twist wrapping.
