    capacity: 400 kg
    construction: Double jacketed with M.S
    body: S.S 304
    legs: M.S
    stirrer: S.S 304
    gearMotorMainDrive: 2 hp
    fittings: Steam gauge, safety valve, seat valve
    dimension: 5'6" x 3'5" x 3'5"
    powerLoad: 2 hp
- name: Cooling Table
  model: SEW-108
  function: >-
    Rapid cooling and conditioning of the cooked sugar mass for uniform texture
