# Lollipop Complete Line 200 kg/hr -- extracted from LOLLIPOP 200 KG.pdf
category: LOLLIPOP
category_slug: lollipop
line:
  name: Lollipop Complete Line 200 kg/hr
  productionRate: 200 kg/hr
  description: >-
    A complete round-lollipop production line with vacuum batch cooking, bubble-gum
    mixing/extrusion, rope sizing, lollipop forming with stick insertion, 5-stage
    cooling with elevator and single-twist wrapping.
  image: ''
source_pdf: assets/STARMER/LOLLIPOP/Lollipop 200 Kg/LOLLIPOP 200 KG.pdf
machines:
- name: Glucose Tank
  model: SEW-101
  function: >-
    Hygienic vertical storage tank for stable, crystal-free storage of liquid
    glucose and syrups.
  description: Vertical S.S 304 tank with base coil heating and external ladder.
  image: ''
  specs:
    grade: S.S 304
    sheetThickness: 5 mm upper and lower sheet
    outerDiaSheetThickness: 3 mm
    designType: Vertical
    heatingSystem: Coil on the base of tank
    ladder: Outside the tank
    capacity: 20 ton glucose
    dimension: 16 ft height x 7 ft diameter
    powerLoad: None
- name: Steam Generator
  model: SEW-102
  function: >-
    Produces high-pressure steam for heating, cleaning and process use across the line.
  description: >-
    Three-pass steam generator with Grundfos multistage feed-water pump,
    automatic electric control panel and burner with gas assembly & diesel pump.
  image: ''
  specs:
    typeOfPasses: 3 pass
    testPressure: 225 psi
    workingPressure: 150 psi
    tubeDia: 2" or 2½"
    pressureShellThickness: 3/8"
    insulationSheetThickness: 24 gauge
    feedWaterPump: Grundfos, multistage
    motor: 2 hp
    capacity: 600 kg/hr   # CHECK (handwritten)
    electricLoad: 5 kW
    dimension: 8' x 3'5" x 3'5"
    powerLoad: 5 hp   # CHECK (handwritten)
- name: Steam Header
  model: SEW-103
  function: >-
    Collects steam from the generator and distributes dry, high-quality steam to
    user points across the line.
  description: Cushioned cylinder header in mild steel with configurable branch pipes.
  image: ''
  specs:
    materialOfHeader: M.S
    diameter: 1 ft
    branchPipes: 1", 2", 3", 4" (depending on system needs)
    design: Cushioned Cylinder
    connections: 5
    dimension: 1 ft (dia) x 3 ft (length)
    powerLoad: None
- name: Batch Type Cooker
  model: SEW-005
  function: >-
    Cooks and concentrates the sugar syrup to the desired final moisture content
    and temperature for high-quality candy.
  description: >-
    Double-jacketed batch cooker with S.S 304 pan and main body, M.S cooker frame,
    2 hp gear-motor main drive, gauges and electric control panel.
  image: ''
  specs:
    capacity: 200 kg per hour
    gearMotorMainDrive: 2 hp
    pan: S.S 304
    mainBody: S.S 304
    cookerFrame: M.S
    construction: Double jacketed with M.S
    controls: Electric control panel, gauges
    dimension: 4' x 2'5" x 3'5"
    powerLoad: 2 hp
- name: Vacuum Pump
  model: SEW-006
  function: >-
    Rapidly removes moisture from the cooked candy mass under reduced pressure to
    prevent caramelisation.
  description: M.S frame vacuum pump unit.
  image: ''
  specs:
    rating: 7.5 hp = 1450 rpm
    frame: M.S
    dimension: 2'5" x 1' x 3'5"
    powerLoad: 7.5 hp
- name: Dissolving Tank
  model: SEW-106
  function: >-
    Controlled dissolution of sugar, glucose syrup and other ingredients into a
